server {
    listen 80;
    server_name localhost;
    
    client_max_body_size 500M;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    location /inference {
        # Connect to whisper-server running natively on macOS
        proxy_pass http://host.docker.internal:8080/inference;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /extract-audio {
        # Connect to audio extraction service (port 5001)
        proxy_pass http://host.docker.internal:5001/extract-audio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /history {
        # Connect to audio extraction service for transcription history
        proxy_pass http://host.docker.internal:5001/history;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /nvidia/ {
        # Connect to backend service for NVIDIA API
        proxy_pass http://host.docker.internal:5001/nvidia/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /audio/ {
        # Connect to backend service for served audio files
        proxy_pass http://host.docker.internal:5001/audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /ollama/ {
        # Connect to local Ollama server running on the macOS host
        proxy_pass http://host.docker.internal:11434/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /audio-health {
        # Health check for audio extraction service
        proxy_pass http://host.docker.internal:5001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}


